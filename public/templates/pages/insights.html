<section class="page-hero">
  <div class="container">
    <nav class="breadcrumbs" aria-label="Breadcrumb"><ol><li><a href="/">Home</a></li><li><span aria-current="page">Insights</span></li></ol></nav>
    <h1>{{title}}</h1>
    {{#if intro}}<p class="lede">{{intro}}</p>{{/if}}
  </div>
</section>
<section class="section section-tight">
  <div class="container">
    {{#if has_filters}}
    <nav class="filter-bar" aria-label="Filter insights by type">
      {{#each filters}}<a class="chip{{#if current}} is-active{{/if}}" href="{{href}}"{{#if current}} aria-current="true"{{/if}}>{{label}}</a>{{/each}}
    </nav>
    {{/if}}
    {{#if insights}}
    <div class="grid grid-3">{{#each insights}}{{> components/insight-card}}{{/each}}</div>
    {{> components/pagination}}
    {{else}}
    <div class="empty-state"><p>Nothing has been published here yet.</p></div>
    {{/if}}
  </div>
</section>
