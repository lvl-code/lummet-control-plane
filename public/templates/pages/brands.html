<section class="page-hero">
  <div class="container">
    <nav class="breadcrumbs" aria-label="Breadcrumb"><ol><li><a href="/">Home</a></li><li><span aria-current="page">Brands</span></li></ol></nav>
    <h1>{{title}}</h1>
    {{#if intro}}<p class="lede">{{intro}}</p>{{/if}}
  </div>
</section>
<section class="section section-tight">
  <div class="container">
    {{#if brands}}
      {{#if has_categories}}
      <div class="filter-bar" role="group" aria-label="Filter brands by category" data-filter-bar hidden>
        <button type="button" class="chip is-active" data-filter="" aria-pressed="true">All ({{brands.length}})</button>
        {{#each categories}}<button type="button" class="chip" data-filter="{{name}}" aria-pressed="false">{{name}} ({{count}})</button>{{/each}}
      </div>
      {{/if}}
      <div class="grid grid-3" data-filter-grid>
        {{#each brands}}{{> components/brand-card}}{{/each}}
      </div>
    {{else}}
      <div class="empty-state"><p>No brands are published yet.</p></div>
    {{/if}}
  </div>
</section>
